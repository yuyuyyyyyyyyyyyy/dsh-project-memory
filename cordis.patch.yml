# Bundle patch layer.
#
# dsh applies this over the base composition of every profile whose
# `dsh.profile.bundles` lists this package. `dsh plugin --profile <name> add`
# appends it there by itself, so this file IS the whole mount.
#
# HOST-PLANE on purpose: the records back every session of a project, so a
# preset realm (one instance per session) would give each session its own copy
# and defeat the feature.
#
# The row name is a BARE PACKAGE NAME, which resolves from the profile
# directory's node_modules, where `dsh plugin add` installed this package. Never
# write it as a `!!js` expression: a row's name is resolved to a module before
# any interpolation, and a non-string name crashes the boot with
# `name.startsWith is not a function`.
- insert:
    - id: project-memory
      name: dsh-project-memory
